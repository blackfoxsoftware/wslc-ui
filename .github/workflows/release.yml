# Release: acontece no merge da dev na main, e em nenhum outro lugar.
#
# A versão vem do `package.json` e as notas vêm do `patchnotes.json` — o
# workflow não inventa nada e não lê commits. Se a tag `v<versao>` já existe,
# este run não faz nada: um push na main que não bumpou a versão (correção de
# README, por exemplo) não republica nem sobrescreve release nenhuma. Ou seja,
# publicar uma versão = subir o `version` do package.json e escrever as notas
# dela, na mesma PR.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  preparar:
    name: Preparar
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.decidir.outputs.versao }}
      tag: ${{ steps.decidir.outputs.tag }}
      publicar: ${{ steps.decidir.outputs.publicar }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # precisa das tags para saber se esta versão já saiu

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validar as notas e decidir se publica
        id: decidir
        run: |
          versao=$(node -p "require('./package.json').version")
          tag="v$versao"
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Falha se o patchnotes.json estiver inválido ou não tiver esta versão.
          npm run patchnotes

          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "### Nada a publicar" >> "$GITHUB_STEP_SUMMARY"
            echo "A tag \`$tag\` já existe. Suba o \`version\` do package.json e escreva as notas dela no \`patchnotes.json\` para lançar uma versão nova." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
            echo "### Publicando \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
            npm run --silent patchnotes -- --notas >> "$GITHUB_STEP_SUMMARY"
          fi

  # As mesmas verificações da dev, agora no estado da main que vai virar tag.
  ci:
    name: CI
    needs: preparar
    if: needs.preparar.outputs.publicar == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Empacota ANTES da tag: config de empacotamento quebrada não pode deixar uma
  # tag publicada sem binário. Se este job falhar, nada foi criado ainda.
  empacotar:
    name: Empacotar
    needs: [preparar, ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Garantir o binário do Electron
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) {
            node node_modules/electron/install.js
          }

      - name: Instalador e portátil
        run: npm run dist

      # O E2E roda contra out/; só aqui o asar, o koffi desempacotado e a DLL em
      # resources/ existem para ser testados.
      - name: Fumaça no app empacotado
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/fumaca-empacotado.ts "dist/win-unpacked/WSLC UI.exe"

      # O latest.yml é o índice que o auto-updater lê para descobrir que existe
      # versão nova. Sem ele a release sai completa aos olhos de quem baixa na
      # mão, e invisível para quem já tem o app instalado — erro que só apareceria
      # uma versão depois. Por isso a checagem é aqui, e é dura.
      - name: Conferir o índice do auto-updater
        shell: bash
        run: test -f dist/latest.yml || { echo '::error::latest.yml não foi gerado'; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: instaladores
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  publicar:
    name: Publicar
    needs: [preparar, ci, empacotar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Gerar as notas
        run: npm run patchnotes -- --notas --saida notas.md

      - uses: actions/download-artifact@v7
        with:
          name: instaladores
          path: dist

      - name: Criar a tag anotada
        env:
          TAG: ${{ needs.preparar.outputs.tag }}
        run: |
          git config user.name 'Rafael de Souza Sell'
          git config user.email 'softwareblackfox@gmail.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preparar.outputs.tag }}
          VERSAO: ${{ needs.preparar.outputs.versao }}
        run: |
          extra=()
          # Versão com sufixo (0.2.0-rc.1) sai marcada como pré-lançamento.
          if [[ "$VERSAO" == *-* ]]; then extra+=(--prerelease); fi
          # O .blockmap é opcional (só o NSIS gera): sem ele o updater baixa o
          # instalador inteiro em vez do diff. O latest.yml não é opcional.
          shopt -s nullglob
          anexos=(dist/*.exe dist/*.blockmap dist/latest.yml)
          gh release create "$TAG" --title "$TAG" --notes-file notas.md --verify-tag "${extra[@]}" "${anexos[@]}"
          echo "[$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) publicada." >> "$GITHUB_STEP_SUMMARY"
